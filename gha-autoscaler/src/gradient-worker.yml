# managed by gradient-gha-autoscaler v@VERSION@
name: gradient-worker
run-name: gradient-worker ${{ inputs.connection }} ${{ inputs.launch_id }}

on:
  workflow_dispatch:
    inputs:
      runs_on:
        type: string
        required: true
      autoscaler_url:
        type: string
        required: true
      connection:
        type: string
        required: true
      launch_id:
        type: string
        required: true
      worker_flake:
        type: string
        required: true
      idle_timeout:
        type: string
        required: true
      max_lifetime:
        type: string
        required: true
      substituters:
        type: string
        required: false
        default: ""
      trusted_public_keys:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  worker:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 360
    steps:
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-substituters = ${{ inputs.substituters }}
            extra-trusted-public-keys = ${{ inputs.trusted_public_keys }}
      - name: Run Gradient worker
        env:
          AUTOSCALER_URL: ${{ inputs.autoscaler_url }}
          CONNECTION: ${{ inputs.connection }}
          LAUNCH_ID: ${{ inputs.launch_id }}
          WORKER_FLAKE: ${{ inputs.worker_flake }}
          IDLE_TIMEOUT: ${{ inputs.idle_timeout }}
          MAX_LIFETIME: ${{ inputs.max_lifetime }}
        run: |
          set -euo pipefail
          oidc=$(curl -sS --fail-with-body \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=gradient-gha-autoscaler" | jq -r .value)
          echo "::add-mask::$oidc"
          swap=$(jq -n --arg token "$oidc" --arg launch_id "$LAUNCH_ID" '{token: $token, launch_id: $launch_id}' \
            | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' --data-binary @- \
              "$AUTOSCALER_URL/c/$CONNECTION/swap")
          token=$(jq -r .token <<<"$swap")
          echo "::add-mask::$token"
          server_url=$(jq -r .server_url <<<"$swap")
          team=$(jq -r .team <<<"$swap")
          worker_id=$(jq -r .worker_id <<<"$swap")
          umask 077
          printf '%s:%s\n' "$team" "$token" > "$RUNNER_TEMP/peers"
          unset swap token oidc
          nix shell "$WORKER_FLAKE" -c gradient-worker \
            --server-url "$server_url" \
            --id "$worker_id" \
            --peers-file "$RUNNER_TEMP/peers" \
            --base-dir "$RUNNER_TEMP/gradient-worker" \
            --gcroots-dir "" \
            --idle-timeout "$IDLE_TIMEOUT" \
            --max-lifetime "$MAX_LIFETIME"
